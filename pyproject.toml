[project]
name = "wisebench"
version = "0.1.0"
description = "A generic pytest hardware-in-the-loop runner for over-the-air updated boards"
authors = [
    { name = "Wise", email = "47094117+tjwise99@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fabric>=3.2.3",
    "paramiko>=3.2",
    "pytest>=9.1.1",
]

[project.entry-points.pytest11]
wisebench = "wisebench.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p no:wisebench -p pytester"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
