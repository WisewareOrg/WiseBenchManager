[project]
name = "wisebench"
dynamic = ["version"]
description = "A generic pytest hardware-in-the-loop runner for over-the-air updated boards"
authors = [
    { name = "Wise", email = "47094117+tjwise99@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fabric>=3.2.3",
    "invoke>=2.0",
    "paramiko>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.15",
    "pytest>=9.1.1",
    "tenacity>=9.2",
]

[project.entry-points.pytest11]
wisebench = "wisebench.plugin"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p no:wisebench -p pytester"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
