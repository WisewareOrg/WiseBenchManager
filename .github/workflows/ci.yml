name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # The consumer-name boundary over every tracked file but the three that state it;
      # git grep exits 1 for no match, so a match or an error fails.
      - name: no consumer name
        run: |
          status=0
          git grep -niI kiosk -- . ':!CLAUDE.md' ':!docs/decisions/' ':!.github/workflows/ci.yml' || status=$?
          if [ "$status" -ne 1 ]; then exit 1; fi
